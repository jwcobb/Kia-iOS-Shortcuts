[project]
name = "kia-shortcuts"
version = "0.2.0"
description = "Explicit multi-account Kia shortcuts API for a Forge VPS"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "hyundai-kia-connect-api==4.29.1",
    "gunicorn==26.2.0",
    "python-dotenv==1.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
